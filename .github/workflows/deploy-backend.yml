# Deploys the backend Express server to Azure App Service.
# Gated on the "CI - Lint, test, build" workflow succeeding.
#
# The build (npm install + zip) runs here rather than reusing a CI
# artifact so this workflow stays self-contained; the tradeoff is
# duplicate work with CI's install step (small and cache-hit).
#
# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Deploy backend
on:
  workflow_run:
    workflows: ["CI - Lint, test, build"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

jobs:
  build:
    # Manual deploys are main-only; automatic deploys require a trusted push.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install production dependencies and check syntax
        run: |
          npm ci --omit=dev
          node --check server.js
          node --check episodeCache.js
          cp ../LICENSE LICENSE

      - name: Zip artifact for deployment
        run: zip -qr release.zip server.js episodeCache.js package.json package-lock.json node_modules LICENSE THIRD_PARTY_NOTICES.txt

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: backend/release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: "Production"
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write #This is required for requesting the JWT

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Unzip artifact for deployment
        run: unzip release.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C7EBFD8CC4A445D1A467C8F3D8651EE3 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_EF793C9E0ED04FE29B9E0ECF477D6F44 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_EC1ADB0B5CB64999BA7DEF256541475F }}

      - name: "Deploy to Azure Web App"
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "QueueTunesBackend"
          slot-name: "Production"
          package: .
