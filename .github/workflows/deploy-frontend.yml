# Deploy only the exact main-branch push that passed CI, never a PR run.
name: Deploy frontend

on:
  workflow_run:
    workflows: ["CI - Lint, test, build"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: false

jobs:
  build_and_deploy_job:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: |
          npm run build
          cp staticwebapp.config.json build/
        working-directory: frontend
        env:
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL }}
          VITE_SPOTIFY_AUTH_URL: ${{ vars.VITE_SPOTIFY_AUTH_URL }}
          VITE_SPOTIFY_CLIENT_ID: ${{ vars.VITE_SPOTIFY_CLIENT_ID }}
          VITE_SPOTIFY_REDIRECT_URL: ${{ vars.VITE_SPOTIFY_REDIRECT_URL }}
      - name: Deploy prebuilt frontend
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_HAPPY_GROUND_0D8A70103 }}
          action: upload
          app_location: frontend/build
          output_location: ""
          skip_app_build: true
          skip_api_build: true
